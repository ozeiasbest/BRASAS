<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ordem de Serviço - BRASAS</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
        .container { width: 700px; background: white; padding: 30px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-top: 8px solid #d32f2f; position: relative; }
        
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .header h1 { margin: 0; color: #d32f2f; font-size: 40px; }
        .header p { margin: 0; font-weight: bold; letter-spacing: 2px; }

        .field-group { margin-bottom: 15px; }
        .label { font-weight: bold; color: #d32f2f; font-size: 12px; text-transform: uppercase; display: block; }
        .editable { padding: 5px; border: 1px dashed transparent; min-height: 20px; outline: none; font-size: 16px; }
        .editable:hover, .editable:focus { border-color: #ccc; background-color: #fffde7; }

        .dynamic-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; padding: 10px; border: 1px solid #f9f9f9; background: #fafafa; }
        .dynamic-item select { padding: 5px; font-size: 14px; }
        .dynamic-item .content-area { flex-grow: 1; }

        .total-section { margin-top: 40px; text-align: right; border-top: 2px solid #eee; padding-top: 10px; font-size: 24px; font-weight: bold; color: #d32f2f; }

        /* Botões */
        .controls { position: fixed; left: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-print { background: #d32f2f; }
        .btn-add-service { background: #2e7d32; }
        .btn-add-obs { background: #0277bd; }
        .btn-remove { background: #ff5252; font-size: 11px; padding: 5px 8px; margin-top: 5px; }

        @media print {
            .controls, .btn-remove { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; }
            .editable { border: none !important; background: none !important; }
            select { border: none; -webkit-appearance: none; appearance: none; background: none; }
        }
    </style>
</head>
<body>

<div class="controls">
    <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn btn-add-service" onclick="addItem('services-list', 'service')">➕ Serviço</button>
    <button class="btn btn-add-obs" onclick="addItem('obs-list', 'obs')">➕ Observação</button>
</div>

<div class="container">
    <div class="header">
        <h1>BRASAS |</h1>
        <p>CHURRASQUEIRO 🔥 E BARMAN 🍸</p>
    </div>

    <div class="field-group">
        <span class="label">Nome do Cliente</span>
        <div class="editable" contenteditable="true">Marcio Muniz</div>
    </div>

    <div class="field-group">
        <span class="label">Data e Horário</span>
        <div class="editable" contenteditable="true">01/05/2026.  14:30</div>
    </div>

    <div id="services-list">
        <span class="label">Serviços</span>
        <!-- Os serviços entram aqui -->
        <div class="dynamic-item">
            <div class="content-area">
                <select>
                    <option value="churrasqueiro">CHURRASQUEIRO🔥</option>
                    <option value="barman">BARMAN 🍸</option>
                </select>
                <div class="editable" contenteditable="true">OZEIAS - Kit barman</div>
            </div>
            <button class="btn-remove" onclick="this.parentElement.remove()""">remover</button>
        </div>
    </div>

    <div id="obs-list" style="margin-top: 20px;">
        <span class="label">Observações</span>
        <!-- As observações entram aqui -->
    </div>

    <div class="total-section">
        VALOR R$ <span contenteditable="true">200,00</span>
    </div>
</div>

<script>
    function addItem(containerId, type) {
        const container = document.getElementById(containerId);
        const div = document.createElement('div');
        div.className = 'dynamic-item';
        
        if (type === 'service') {
            div.innerHTML = `
                <div class="content-area">
                    <select>
                        <option value="churrasqueiro">CHURRASQUEIRO</option>
                        <option value="barman">BARMAN</option>
                    </select>
                    <div class="editable" contenteditable="true">Descreva o serviço...</div>
                </div>
                <button class="btn-remove" onclick="this.parentElement.remove()">remover</button>
            `;
        } else {
            div.innerHTML = `
                <div class="content-area">
                    <div class="editable" contenteditable="true">Digite sua observação aqui...</div>
                </div>
                <button class="btn-remove" onclick="this.parentElement.remove()">remover</button>
            `;
        }
        container.appendChild(div);
    }
</script>

</body>
</html>
